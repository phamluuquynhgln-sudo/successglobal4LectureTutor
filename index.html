<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>English 4 Global Success Ôn Tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap">
<style>
/* Layout: one column, sticker cards on a confetti ground; sticky unit chips + tab bar */
:root{
  --ground:#FFF1E3; --ground-2:#FFE0C6; --surface:#FFFFFF; --surface-2:#FFF7EF;
  --ink:#3A2116; --ink-soft:#8A6350; --line:#3A2116; --shadow:rgba(58,33,22,.9);
  --orange:#FF6B1A; --orange-soft:#FFD9BC; --orange-deep:#C24400; --apricot:#FFB44F;
  --pink:#FF4E8A; --pink-soft:#FFDCE8; --mint:#0F9B8E; --mint-soft:#CFF0EC;
  --wrong:#D93025; --wrong-soft:#FFE0DD; --focus:#1D6FE0; --sky:#2C7BE5;
  --dot1:rgba(255,107,26,.13); --dot2:rgba(255,78,138,.10); --dot3:rgba(15,155,142,.10);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#241610; --ground-2:#2E1D15; --surface:#37241C; --surface-2:#2F1F18;
  --ink:#FFEEE0; --ink-soft:#D8B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange:#FF7A2E; --orange-soft:#5A3020; --orange-deep:#FFB27A; --apricot:#FFB44F;
  --pink:#FF6B9E; --pink-soft:#55243A; --mint:#3CCFBF; --mint-soft:#163D39;
  --wrong:#FF7B70; --wrong-soft:#4A1F1C; --focus:#7FB0FF; --sky:#7FB0FF;
  --dot1:rgba(255,122,46,.10); --dot2:rgba(255,107,158,.08); --dot3:rgba(60,207,191,.07);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#241610; --ground-2:#2E1D15; --surface:#37241C; --surface-2:#2F1F18;
  --ink:#FFEEE0; --ink-soft:#D8B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange:#FF7A2E; --orange-soft:#5A3020; --orange-deep:#FFB27A; --apricot:#FFB44F;
  --pink:#FF6B9E; --pink-soft:#55243A; --mint:#3CCFBF; --mint-soft:#163D39;
  --wrong:#FF7B70; --wrong-soft:#4A1F1C; --focus:#7FB0FF; --sky:#7FB0FF;
  --dot1:rgba(255,122,46,.10); --dot2:rgba(255,107,158,.08); --dot3:rgba(60,207,191,.07);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(var(--dot1) 3px,transparent 4px),radial-gradient(var(--dot2) 2.5px,transparent 3.5px),radial-gradient(var(--dot3) 2px,transparent 3px);
  background-size:68px 68px,90px 90px,52px 52px;background-position:0 0,30px 44px,14px 20px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.sticker{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:1rem;
  background:var(--orange);color:#3A2116;border:2.5px solid var(--line);border-radius:14px;padding:6px 14px;cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s;min-height:42px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active,.btn.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.mint{background:var(--mint-soft);color:var(--ink)}
.btn.pink{background:var(--pink-soft);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.spk{width:42px;height:42px;padding:0;border-radius:50%;flex:none;font-size:1.1rem}
.spk.sm{width:34px;height:34px;min-height:34px;font-size:.9rem;box-shadow:2px 2px 0 var(--shadow)}
.spk.on{background:var(--apricot);animation:pulse .9s infinite}
@keyframes pulse{50%{transform:translate(3px,3px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{padding-top:12px}
.bunting{display:block;width:100%;height:34px}
.brand{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.brand svg{width:44px;height:33px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;color:var(--orange-deep);letter-spacing:.08em;font-size:1.05rem}
.brand span{display:block;font-size:.8rem;color:var(--ink-soft);letter-spacing:.02em}
.unitbar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:thin}
.chip{flex:none;font-family:var(--f-display);font-weight:700;background:var(--surface);border:2.5px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);font-size:.95rem}
.chip[aria-current="true"]{background:var(--orange);color:#3A2116;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.hero{padding:18px 20px;display:grid;gap:8px;position:relative;overflow:hidden}
.hero .eyebrow{font-family:var(--f-display);font-weight:800;color:var(--orange-deep);letter-spacing:.12em;font-size:.9rem}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
.hero .vi{color:var(--ink-soft);font-weight:700;font-size:1.05rem}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{background:var(--orange-soft);border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-weight:800;font-size:.85rem}
.pill.m{background:var(--mint-soft)}.pill.p{background:var(--pink-soft)}
.hero .big{position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-weight:800;font-size:8rem;color:var(--orange);opacity:.16;line-height:1;pointer-events:none}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding:12px 2px 10px;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--f-display);font-weight:700;font-size:.98rem;background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:5px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.tab[aria-selected="true"]{background:var(--orange);color:#3A2116;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.tab.tutor{background:var(--pink-soft)}
.tab.tutor[aria-selected="true"]{background:var(--pink);color:#3A2116}
.panel{padding-top:8px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.sec-h h2{font-size:1.5rem}
.sec-h small{color:var(--ink-soft);font-weight:700}
.note{color:var(--ink-soft);font-size:.92rem}

/* pictures */
.pic{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pic .emo{font-size:var(--ps,48px);line-height:1}
.pic svg{width:calc(var(--ps,48px)*1.35);height:auto;display:block}
.pic svg.clock{width:calc(var(--ps,48px)*1.15)}
.flag{border-radius:4px;overflow:hidden;border:2px solid var(--line);display:inline-block;line-height:0}
.cal{width:calc(var(--ps,48px)*1.25);border:2.5px solid var(--line);border-radius:10px;background:var(--surface);position:relative;text-align:center;overflow:hidden;font-family:var(--f-display)}
.cal .band{background:var(--orange);color:#3A2116;font-weight:800;font-size:calc(var(--ps,48px)*.3);letter-spacing:.06em;padding:4px 0 1px;border-bottom:2.5px solid var(--line)}
.cal .num{font-weight:800;font-size:calc(var(--ps,48px)*.55);padding:1px 0 2px;color:var(--ink)}
.cal::before,.cal::after{content:"";position:absolute;top:2px;width:6px;height:9px;border-radius:3px;background:var(--surface);border:2px solid var(--line)}
.cal::before{left:22%}.cal::after{right:22%}
.cal.wkd .band{background:var(--pink)}

/* vocab */
.vgroup h3{font-size:1.15rem;margin:18px 0 10px;display:inline-block;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:1px 12px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@media (max-width:420px){.vgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.vcard{padding:12px;display:flex;flex-direction:column;gap:8px}
.vcard .imgbox{border:2.5px dashed var(--orange);border-radius:26px 30px 24px 32px;background:var(--surface-2);height:98px;display:flex;align-items:center;justify-content:center;--ps:50px}
.vcard .row{display:flex;align-items:center;gap:8px}
.vcard .row>div{min-width:0;flex:1}
.vcard .en{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.1;overflow-wrap:anywhere}
.vcard .ipa{color:var(--ink-soft);font-size:.85rem}
.vcard .vi{font-weight:800;color:var(--mint)}
.exl{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--orange-deep)}
.vcard .ex{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;border-top:2px dotted var(--ink-soft);padding-top:6px}
.vcard .ex p{margin:0;flex:1;min-width:0}
mark.hl{background:none;color:var(--orange-deep);font-weight:800}

/* structures */
.sgrid{display:grid;gap:16px}
.scard{padding:16px;display:grid;gap:10px}
.scard .head{display:flex;gap:10px;align-items:center}
.scard .head .pic{--ps:34px}
.scard h3{font-size:1.2rem}
.formula{font-family:var(--f-display);font-weight:700;font-size:1.1rem;border:2.5px dashed var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);overflow-wrap:anywhere}
.formula .v{background:var(--orange);color:#3A2116;border-radius:8px;padding:0 6px;border:2px solid var(--line)}
.tip{background:var(--mint-soft);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.95rem}
.tip b{color:var(--ink)}
.exrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dotted var(--orange-soft)}
.exrow:last-child{border-bottom:0}
.exrow div{flex:1;min-width:0}
.exrow .e{font-weight:800}
.exrow .t{color:var(--ink-soft);font-size:.9rem}

/* story */
.storybox{padding:16px;display:grid;gap:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;font-weight:700}
.sline{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:12px;font-size:1.08rem}
.sline p{margin:0;flex:1;min-width:0;padding-top:4px}
.sline.active{background:var(--orange-soft)}
b.w{color:var(--orange-deep)}
i.s{font-style:normal;text-decoration:underline dotted var(--mint) 2.5px;text-underline-offset:4px}
.yn{display:grid;gap:12px;margin-top:14px}
.ynq{padding:12px 14px;display:grid;gap:8px}
.ynq .q{font-weight:800}
.ynq .btns{display:flex;gap:8px}
.ynq .btn.picked{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.fb{border-radius:12px;padding:8px 12px;border:2px solid var(--line);font-size:.95rem}
.fb.ok{background:var(--mint-soft)}.fb.no{background:var(--wrong-soft)}
.stars{font-size:1.3rem;letter-spacing:2px;color:var(--apricot)}

/* practice */
.scorebar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.scorebar .sc{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.ex-block{margin-top:22px}
.qlist{display:grid;gap:12px}
.qi{padding:12px 14px;display:grid;gap:8px}
.qi .qn{font-family:var(--f-display);font-weight:800;color:var(--orange-deep)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{background:var(--surface-2);border:2.5px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:3px 3px 0 var(--shadow);text-align:center;min-height:46px;justify-content:center}
.opt .pic{--ps:34px}
.opt:hover:not([disabled]){background:var(--orange-soft)}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.wrongp{background:var(--wrong-soft);border-color:var(--wrong);text-decoration:line-through}
.opt[disabled]{cursor:default}
.fill{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:1.05rem;font-weight:700}
.fill input,.qw input{font:inherit;font-weight:800;border:2.5px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface);color:var(--ink)}
.fill input{width:11ch}
.qw input{width:100%}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tray,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:6px;border-radius:12px}
.built{border:2.5px dashed var(--line);background:var(--surface-2)}
.wchip{background:var(--apricot);color:#3A2116;border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.built .wchip{background:var(--orange-soft);color:var(--ink)}

/* mistakes */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard{padding:14px;display:grid;gap:8px;align-content:start}
.tag{justify-self:start;background:var(--pink-soft);border:2px solid var(--line);border-radius:999px;padding:0 10px;font-weight:800;font-size:.8rem}
.bad,.good{border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.bad{background:var(--wrong-soft)}.bad span{text-decoration:line-through;text-decoration-color:var(--wrong);text-decoration-thickness:2px}
.good{background:var(--mint-soft)}.good span{flex:1;min-width:0}

/* flashcards */
.deck{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.deck .btn.sel{background:var(--orange);transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.deck .btn{background:var(--surface)}
.fprog{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:800;margin-bottom:10px}
.scene{perspective:1400px;max-width:560px;margin:0 auto}
.fcard{position:relative;height:clamp(320px,50vh,420px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.25,1);cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg)}
.fcard:not(.flipped) .face.back{pointer-events:none}
.fcard.flipped .face.front{pointer-events:none}
.face .pic{--ps:78px}
.face .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,5vw,2.2rem);line-height:1.15;overflow-wrap:anywhere}
.face .rv{position:absolute;top:12px;left:12px;background:var(--pink-soft);border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:800}
.face .hint{color:var(--ink-soft);font-size:.85rem;font-weight:700}
.fbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* congrats */
.congrats{padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center;position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(255,107,26,.35) 4px,transparent 5px),radial-gradient(rgba(255,78,138,.35) 3px,transparent 4px),radial-gradient(rgba(15,155,142,.35) 3px,transparent 4px);
  background-size:60px 60px,46px 46px,38px 38px;background-position:0 0,20px 14px,8px 30px;background-color:var(--surface)}
.congrats .trophy{font-size:4rem;line-height:1}
.congrats h2{font-size:2rem}
.congrats .s5{font-size:2rem;color:var(--apricot);letter-spacing:4px}
.congrats .qec{font-family:var(--f-display);font-weight:800;color:var(--orange-deep)}

/* tutor */
.tsetup{padding:16px;display:grid;gap:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--surface-2);border:2.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);display:grid;gap:4px}
.mode b{font-family:var(--f-display);font-size:1.2rem}
.mode span{color:var(--ink-soft);font-size:.9rem}
.mode .ic{font-size:1.8rem}
.mode.sel{background:var(--pink-soft);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lbl{font-weight:800;min-width:96px}
.seg button{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;cursor:pointer}
.seg button.sel{background:var(--orange);color:#3A2116}
.tstage{padding:16px;display:grid;gap:14px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.meter{height:14px;border:2.5px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.teacher{display:flex;gap:10px;align-items:flex-start}
.teacher .av{width:52px;height:52px;flex:none;border:2.5px solid var(--line);border-radius:50%;background:var(--apricot);display:flex;align-items:center;justify-content:center}
.teacher .av svg{width:34px;height:26px}
.bubble{position:relative;background:var(--surface-2);border:2.5px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:700;flex:1;min-width:0}
.bubble small{display:block;color:var(--ink-soft);font-weight:700;font-size:.8rem}
.retry{display:inline-block;background:var(--wrong-soft);border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:800;margin-bottom:4px}
.prompt{display:grid;justify-items:center;gap:10px;text-align:center;padding:10px;border:2.5px dashed var(--orange);border-radius:20px;background:var(--surface-2)}
.prompt .pic{--ps:72px}
.prompt .ptext{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4.6vw,2rem);line-height:1.2;overflow-wrap:anywhere}
.prompt .hidden-en{color:var(--ink-soft);font-weight:800}
.bigplay{font-size:1.2rem;padding:10px 22px;min-height:52px}
.topts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.topt{background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:1.05rem;box-shadow:3px 3px 0 var(--shadow);display:flex;gap:10px;align-items:center;text-align:left;min-height:54px}
.topt .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--apricot);color:#3A2116;display:flex;align-items:center;justify-content:center;font-family:var(--f-display)}
.topt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.topt:hover:not(.lock){background:var(--orange-soft)}
.topt.right{background:var(--mint-soft);border-color:var(--mint)}
.topt.wrongp{background:var(--wrong-soft);border-color:var(--wrong)}
.topt.lock{cursor:default}
.aopt{background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:3px 3px 0 var(--shadow);min-height:58px}
.aopt .tx{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.aopt .tx.mask{color:var(--ink-soft);font-weight:700;font-size:.9rem}
.aopt.right{background:var(--mint-soft);border-color:var(--mint)}
.aopt.wrongp{background:var(--wrong-soft);border-color:var(--wrong)}
.tfb{border-radius:14px;padding:10px 14px;border:2.5px solid var(--line);font-weight:700;display:grid;gap:4px}
.tfb.ok{background:var(--mint-soft)}.tfb.no{background:var(--wrong-soft)}
.tfb .en{font-family:var(--f-display);font-size:1.15rem;font-weight:800}

.novoice{display:none;margin:10px 0;background:var(--wrong-soft);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}

  if(ex===1||ex===2){var o=e.target.closest(".opt");if(!o||st.done)return;st.done=true;var j=+o.getAttribute("data-j");

    var okIdx=ex===1?PR.e1[i].o.indexOf(PR.e1[i].w):PR.e2[i].o.findIndex(function(x){return x.ok});
    opts[okIdx].classList.add("right");if(j!==okIdx)o.classList.add("wrongp");else PR.score[ex-1]++;
    if(ex===1)speak(PR.e1[i].w.en,{rate:0.72});
    else{var q=PR.e2[i].q,full=q[0].replace("___",q[1][q[2]]);box.querySelector(".fbx").innerHTML='<div class="fb '+(j===okIdx?"ok":"no")+'">'+(j===okIdx?"✅ ":"❌ ")+'<b>'+esc(full)+'</b><br>'+q[3]+'</div>';speak(full.replace(/\(.*?\)/g,""),{rate:0.8})}
    updPR();return}
  if(ex===4){var c=e.target.closest(".wchip");if(c&&!st.done){var tray=$("#t4-"+i),built=$("#b4-"+i);(c.parentNode===tray?built:tray).appendChild(c);return}}
  if(e.target.closest("[data-chk]")&&!st.done)check(box,ex,i,st);
  if(e.target.closest("[data-show]")&&!st.done)reveal(box,ex,i,st);
});
$("#p-prac").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT"){var box=e.target.closest(".qi");if(box&&!box._st.done)check(box,+box.getAttribute("data-e"),+box.getAttribute("data-i"),box._st)}});
function ans(ex,i){if(ex===3)return PR.e3[i].en;if(ex===4)return PR.e4[i].s;return PR.e5[i][1][0]}
function check(box,ex,i,st){
  var ok=false,empty=false,fb=box.querySelector(".fbx");
  if(ex===3){var v=$("#f3-"+i).value.trim().replace(/[’‘]/g,"'");empty=!v;ok=v.toLowerCase()===PR.e3[i].en.toLowerCase()}
  if(ex===4){var got=$$("#b4-"+i+" .wchip").map(function(c){return c.textContent});empty=got.length<PR.e4[i].t.length;ok=got.join(" ")===PR.e4[i].t.join(" ")}
  if(ex===5){var v5=$("#f5-"+i).value.trim();empty=!v5;var n=normQ(v5);ok=PR.e5[i][1].some(function(a){return normQ(a)===n})}
  if(empty){fb.innerHTML='<div class="fb no">Em làm xong câu này rồi bấm Kiểm tra nhé.</div>';return}
  if(ok){st.done=true;if(st.wrong===0&&!st.shown)PR.score[ex-1]++;updPR();box.querySelector("[data-show]").hidden=true;
    var say=ex===3?PR.e3[i].ex:ex===4?PR.e4[i].s:PR.e5[i][1][0];
    fb.innerHTML='<div class="fb ok">✅ Giỏi quá! <b>'+esc(say)+'</b></div>';if(ex!==4)speak(say,{rate:0.8});
    $$("input,[data-chk]",box).forEach(function(x){x.disabled=true})}
  else{st.wrong++;fb.innerHTML='<div class="fb no">❌ Chưa đúng, em thử lại nhé.'+(st.wrong>=2?' Nếu khó quá em có thể xem đáp án.':'')+'</div>';if(st.wrong>=2)box.querySelector("[data-show]").hidden=false}
}
function reveal(box,ex,i,st){st.shown=true;st.done=true;var a=ex===3?PR.e3[i].en+" → "+PR.e3[i].ex:ans(ex,i);
  if(ex===5&&PR.e5[i][1].length>1)a=PR.e5[i][1].join("  /  ");
  box.querySelector(".fbx").innerHTML='<div class="fb ok">👀 Đáp án: <b>'+esc(a)+'</b> (câu này không tính điểm)</div>';
  box.querySelector("[data-show]").hidden=true;$$("input,[data-chk]",box).forEach(function(x){x.disabled=true})}

/* ---------- 5. mistakes ---------- */
function renderMist(){
  $("#p-mist").innerHTML='<div class="sec-h"><h2>Lỗi hay gặp</h2><small>Đọc kỹ để không mắc lỗi nhé</small></div><div class="mgrid">'+U.mistakes.map(function(m){
    return '<article class="mcard sticker"><span class="tag">'+esc(m[0])+'</span><div class="bad">❌ <span>'+esc(m[1])+'</span></div><div class="good">✅ <span>'+esc(m[2])+'</span>'+spk(m[2],1)+'</div><div class="tip">💡 '+m[3]+'</div></article>'}).join("")+'</div>';

/* ---------- congrats ---------- */

}

/* ---------- 6. flashcards ---------- */
var FL={deck:"w",q:[],known:0,total:0,flipped:false,
 init:function(){this.start(this.deck)},
 cards:function(d){return d==="w"?words(U).map(function(w){return{front:w.vi,img:w.img,en:w.en,ipa:w.ipa,ex:w.ex}}):sentences(U).map(function(s){return{front:s.vi,img:s.img,en:s.en,ipa:"",ex:""}})},
 start:function(d){stopAll();this.deck=d;this.q=shuffle(this.cards(d)).map(function(c){c.rv=0;return c});this.total=this.q.length;this.known=0;this.flipped=false;this.render()},
 render:function(){
  var p=$("#p-flash"),self=this,dname=this.deck==="w"?"từ vựng":"câu";
  var h='<div class="sec-h"><h2>Thẻ ghi nhớ</h2><small>Học đến khi thuộc · Space lật thẻ · → đã thuộc · ← chưa thuộc</small></div><div class="deck"><button class="btn'+(this.deck==="w"?" sel":"")+'" data-deck="w">Bộ Từ vựng</button><button class="btn'+(this.deck==="s"?" sel":"")+'" data-deck="s">Bộ Câu</button></div>';
  if(!this.q.length){
    h+=congrats("Chúc mừng em!","Em đã thuộc tất cả "+this.total+" "+dname+" của Unit "+U.n+".",'<button class="btn" data-fl="again">🔁 Ôn lại lần nữa</button><button class="btn mint" data-fl="other">Học tiếp bộ '+(this.deck==="w"?"Câu":"Từ vựng")+'</button>');
    p.innerHTML=h;speak("Congratulations!",{rate:0.85});return}
  var c=this.q[0];
  h+='<div class="fprog"><span>Đã thuộc '+this.known+'/'+this.total+'</span><span>Còn '+this.q.length+' thẻ cần ôn</span></div><div class="meter" style="margin-bottom:14px"><i style="width:'+(this.known/this.total*100)+'%"></i></div>'+
   '<div class="scene"><div class="fcard sticker'+(this.flipped?" flipped":"")+'" id="fcard" tabindex="0" aria-label="Thẻ, bấm để lật"><div class="face front">'+(c.rv?'<span class="rv">Ôn lại lần '+c.rv+'</span>':'')+pic(c.img)+'<div class="big">'+esc(c.front)+'</div><div class="hint">Bấm vào thẻ để lật</div></div>'+
   '<div class="face back"><div class="big">'+esc(c.en)+'</div>'+(c.ipa?'<div class="hint">'+esc(c.ipa)+'</div>':'')+spk(c.en)+(c.ex?'<div class="note">'+hlWord(c.ex,c.en)+'</div>':'')+'</div></div></div>'+
   '<div class="fbtns"><button class="btn pink" data-fl="no">🔁 Chưa thuộc – ôn lại</button><button class="btn mint" data-fl="yes">✅ Đã thuộc</button></div><div class="fbtns"><button class="btn ghost" data-fl="restart">🔄 Học lại từ đầu</button></div>';
  p.innerHTML=h;
 },
 flip:function(){var el=$("#fcard");if(!el)return;this.flipped=!this.flipped;el.classList.toggle("flipped",this.flipped);if(this.flipped){var c=this.q[0];speak(c.en,{rate:rateFor(c.en)})}else stopAll()},
 next:function(knew){if(!this.q.length)return;stopAll();var c=this.q.shift();if(knew)this.known++;else{c.rv++;this.q.push(c)}this.flipped=false;this.render()}
};
$("#p-flash").addEventListener("click",function(e){
  var d=e.target.closest("[data-deck]");if(d){FL.start(d.getAttribute("data-deck"));return}
  var a=e.target.closest("[data-fl]");if(a){var k=a.getAttribute("data-fl");
    if(k==="yes")FL.next(true);else if(k==="no")FL.next(false);else if(k==="restart"||k==="again")FL.start(FL.deck);else if(k==="other")FL.start(FL.deck==="w"?"s":"w");return}
  if(e.target.closest("[data-say]"))return;
  if(e.target.closest("#fcard"))FL.flip();
});
document.addEventListener("keydown",function(e){
  if($("#p-flash").hidden)return;var t=e.target;if(t.tagName==="INPUT"||t.getAttribute("role")==="tab")return;
  if(e.key===" "){e.preventDefault();FL.flip()}else if(e.key==="ArrowRight")FL.next(true);else if(e.key==="ArrowLeft")FL.next(false);
});

/* ---------- 7. TUTOR ---------- */
var CROWN='<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M4 40 L8 12 L22 26 L32 6 L42 26 L56 12 L60 40 Z" fill="#FFF7EF" stroke="#3A2116" stroke-width="3" stroke-linejoin="round"/><rect x="4" y="38" width="56" height="7" rx="2" fill="#FF6B1A" stroke="#3A2116" stroke-width="3"/></svg>';
var TU={mode:"text",set:"both",dir:"both",run:null,
 items:function(){var a=[];if(this.set!=="s")words(U).forEach(function(w){a.push({k:"w",en:w.en,vi:w.vi,img:w.img,g:w.g,ipa:w.ipa})});
   if(this.set!=="w")sentences(U).forEach(function(s){a.push({k:"s",en:s.en,vi:s.vi,img:s.img,g:s.s})});return a},
 reset:function(){stopAll();this.run=null;this.renderSetup()},
 count:function(){return this.items().length*(this.dir==="both"?2:1)},
 renderSetup:function(){
  var s=this,seg=function(name,lbl,opts){return '<div class="seg" role="group" aria-label="'+lbl+'"><span class="lbl">'+lbl+'</span>'+opts.map(function(o){return '<button data-'+name+'="'+o[0]+'" class="'+(s[name]===o[0]?"sel":"")+'">'+o[1]+'</button>'}).join("")+'</div>'};
  $("#p-tutor").innerHTML='<div class="sec-h"><h2>Tutor</h2><small>Cô hỏi – em chọn 1 trong 4 đáp án. Câu nào sai, cô sẽ hỏi lại sau vài câu cho đến khi em làm đúng.</small></div>'+
  '<div class="tsetup sticker"><div class="modes">'+
   '<button class="mode'+(s.mode==="text"?" sel":"")+'" data-mode="text"><span class="ic">📝🖼️</span><b>Tutor chữ + hình</b><span>Đọc câu hỏi và đáp án bằng chữ, có hình minh hoạ.</span></button>'+
   '<button class="mode'+(s.mode==="audio"?" sel":"")+'" data-mode="audio"><span class="ic">🔊🖼️</span><b>Tutor âm thanh + hình</b><span>Phần tiếng Anh chỉ được nghe, không hiện chữ. Phần tiếng Việt hiện bằng chữ.</span></button></div>'+
   seg("set","Nội dung",[["both","Từ vựng + Câu"],["w","Từ vựng"],["s","Cấu trúc câu"]])+
   seg("dir","Chiều hỏi",[["both","Cả hai chiều"],["v2e","Việt → Anh"],["e2v","Anh → Việt"]])+
   '<div class="act"><button class="btn" id="tustart" style="font-size:1.15rem">▶ Bắt đầu · '+s.count()+' câu</button><span class="note">Unit '+U.n+' – '+esc(U.en)+'</span></div></div>';
 },
 start:function(){stopAll();var self=this,qs=[];
  this.items().forEach(function(it){if(self.dir!=="e2v")qs.push({it:it,d:"v2e"});if(self.dir!=="v2e")qs.push({it:it,d:"e2v"})});
  qs=shuffle(qs);
  /* tránh cùng 1 từ hỏi 2 chiều liền nhau */
  for(var i=1;i<qs.length;i++){if(qs[i].it===qs[i-1].it){for(var j=i+1;j<qs.length;j++){if(qs[j].it!==qs[i-1].it&&(j+1>=qs.length||qs[j].it!==qs[i].it)){var t=qs[i];qs[i]=qs[j];qs[j]=t;break}}}}
  qs.forEach(function(q,i){q.id=i;q.wrong=0});
  this.run={queue:qs,total:qs.length,done:0,first:0,pending:{},cur:null,answered:false,doneList:[]};
  this.next();
 },
 opts:function(q){var it=q.it,pool=this.items().filter(function(x){return x.k===it.k&&x.en!==it.en&&x.vi!==it.vi});
   var same=shuffle(pool.filter(function(x){return x.g===it.g})),other=shuffle(pool.filter(function(x){return x.g!==it.g}));
   var pick=[],seenEn={},seenVi={};seenEn[it.en]=1;seenVi[it.vi]=1;
   same.concat(other).forEach(function(x){if(pick.length<3&&!seenEn[x.en]&&!seenVi[x.vi]){pick.push(x);seenEn[x.en]=1;seenVi[x.vi]=1}});
   return shuffle([it].concat(pick))},
 next:function(){stopAll();var r=this.run;if(!r.queue.length){this.finish();return}
  r.cur=r.queue.shift();r.cur.o=this.opts(r.cur);r.answered=false;this.render();
  var q=r.cur;if(this.mode==="audio"&&q.d==="e2v")setTimeout(function(){speak(q.it.en,{rate:rateFor(q.it.en),btn:$("#tuplay")})},250);
 },
 render:function(){
  var r=this.run,q=r.cur,it=q.it,audio=this.mode==="audio",isW=it.k==="w",pend=Object.keys(r.pending).length;
  var ask=q.d==="v2e"?(isW?'Từ <b>“'+esc(it.vi)+'”</b> trong tiếng Anh là gì?':'Câu này nói bằng tiếng Anh thế nào?'):(isW?(audio?'Em nghe từ này nhé. Từ đó nghĩa là gì?':'Từ này nghĩa là gì?'):(audio?'Em nghe câu này nhé. Câu đó nghĩa là gì?':'Câu này nghĩa là gì?'));
  if(q.d==="v2e"&&audio)ask+=' <small>Bấm 🔊 ở từng đáp án để nghe rồi chọn.</small>';
  var prompt;
  if(q.d==="v2e")prompt=pic(it.img)+'<div class="ptext">'+esc(it.vi)+'</div>'+(audio?'<div class="note">(Chưa có giọng đọc tiếng Việt nên phần tiếng Việt hiện bằng chữ.)</div>':'');
  else if(audio)prompt=pic(it.img)+'<button class="btn bigplay" id="tuplay" data-say="'+esc(it.en)+'" data-rate="'+rateFor(it.en)+'">🔊 Nghe lại</button><div class="hidden-en" id="tuhid">? ? ?</div>';
  else prompt=pic(it.img)+'<div class="ptext">'+esc(it.en)+'</div>'+spk(it.en,1);
  var keys=["A","B","C","D"],opts;
  if(q.d==="v2e"&&audio){
    opts=q.o.map(function(o,j){return '<div class="aopt" data-j="'+j+'"><button class="btn spk" data-say="'+esc(o.en)+'" data-rate="'+rateFor(o.en)+'" aria-label="Nghe đáp án '+keys[j]+'">🔊</button><div class="tx mask">Đáp án '+keys[j]+'</div><button class="btn mint" data-pick="'+j+'">Chọn '+keys[j]+'</button></div>'}).join("");
  }else{
    opts=q.o.map(function(o,j){return '<button class="topt" data-pick="'+j+'"><span class="k">'+keys[j]+'</span><span class="tx">'+esc(q.d==="v2e"?o.en:o.vi)+'</span></button>'}).join("");
  }
  $("#p-tutor").innerHTML='<div class="sec-h"><h2>Tutor · '+(audio?"Âm thanh + hình":"Chữ + hình")+'</h2><small>'+(isW?"Từ vựng":"Cấu trúc câu")+' · '+(q.d==="v2e"?"Việt → Anh":"Anh → Việt")+'</small></div>'+
  '<div class="tstage sticker"><div class="tbar"><b>Đã đúng '+r.done+'/'+r.total+'</b><span class="pill p">Câu sai chờ làm lại: '+pend+'</span><button class="btn ghost" id="tuquit">⟵ Đổi chế độ</button></div><div class="meter"><i style="width:'+(r.done/r.total*100)+'%"></i></div>'+
  '<div class="teacher"><div class="av">'+CROWN+'</div><div class="bubble">'+(q.wrong?'<span class="retry">🔁 Làm lại câu đã sai (lần '+(q.wrong+1)+')</span><br>':'')+(q.filler?'<span class="retry">⭐ Ôn nhanh 1 câu đã đúng</span><br>':'')+ask+'</div></div>'+
  '<div class="prompt">'+prompt+'</div><div class="topts" id="tuopts">'+opts+'</div><div id="tufb"></div></div>';
 },
 pick:function(j){var r=this.run;if(!r||r.answered)return;r.answered=true;stopAll();
  var q=r.cur,ok=q.o[j]===q.it,right=q.o.indexOf(q.it),audio=this.mode==="audio";
  var els=$$("#tuopts > *");els.forEach(function(el,k){el.classList.add("lock");if(k===right)el.classList.add("right");if(k===j&&!ok)el.classList.add("wrongp");
    if(audio&&q.d==="v2e"){el.querySelector(".tx").classList.remove("mask");el.querySelector(".tx").textContent=q.o[k].en;var pb=el.querySelector("[data-pick]");if(pb)pb.disabled=true}});
  var h=$("#tuhid");if(h){h.textContent=q.it.en;h.className="ptext"}
  if(q.filler){}
  else if(ok){r.done++;if(!q.wrong)r.first++;delete r.pending[q.id];r.doneList.push(q)}
  else{q.wrong++;r.pending[q.id]=1;var gap=Math.min(r.queue.length,2+Math.floor(Math.random()*2));
    var again={it:q.it,d:q.d,id:q.id,wrong:q.wrong};
    if(gap===0&&r.doneList.length){var f=r.doneList[Math.floor(Math.random()*r.doneList.length)];r.queue.push({it:f.it,d:f.d,id:-1,wrong:0,filler:true});r.queue.push(again)}
    else r.queue.splice(gap,0,again)}
  var it=q.it;
  $("#tufb").innerHTML='<div class="tfb '+(ok?"ok":"no")+'">'+(ok?'<span>✅ Đúng rồi! Giỏi lắm!</span>':'<span>❌ Chưa đúng. Đáp án đúng là:</span>')+'<span class="en">'+esc(it.en)+'</span><span>'+esc(it.vi)+'</span>'+(!ok&&!q.filler?'<span class="note">Cô sẽ hỏi lại câu này sau vài câu nữa nhé.</span>':'')+
   '<div class="act">'+spk(it.en,1)+'<button class="btn" id="tunext">Câu tiếp theo ➜</button></div></div>';
  $(".tbar b").textContent="Đã đúng "+r.done+"/"+r.total;$(".tbar .pill").textContent="Câu sai chờ làm lại: "+Object.keys(r.pending).length;$(".tstage .meter i").style.width=(r.done/r.total*100)+"%";
  speak(it.en,{rate:rateFor(it.en)});
  var nb=$("#tunext");if(nb)nb.focus({preventScroll:true});
 },
 finish:function(){var r=this.run;
  $("#p-tutor").innerHTML='<div class="sec-h"><h2>Tutor</h2></div>'+congrats("Chúc mừng em!","Em đã trả lời đúng tất cả "+r.total+" câu của Unit "+U.n+". Đúng ngay lần đầu: "+r.first+"/"+r.total+".",'<button class="btn" id="tuagain">🔁 Làm lại</button><button class="btn mint" id="tuquit">Đổi chế độ</button>');
  speak("Congratulations!",{rate:0.85});
 }
};
$("#p-tutor").addEventListener("click",function(e){
  var t=e.target;
  var m=t.closest("[data-mode]");if(m){TU.mode=m.getAttribute("data-mode");TU.renderSetup();return}
  var s=t.closest("[data-set]");if(s){TU.set=s.getAttribute("data-set");TU.renderSetup();return}
  var d=t.closest("[data-dir]");if(d){TU.dir=d.getAttribute("data-dir");TU.renderSetup();return}
  if(t.closest("#tustart")||t.closest("#tuagain")){TU.start();return}
  if(t.closest("#tuquit")){TU.reset();return}
  if(t.closest("#tunext")){TU.next();return}
  var p=t.closest("[data-pick]");if(p&&!t.closest("[data-say]")){TU.pick(+p.getAttribute("data-pick"));return}
});
document.addEventListener("keydown",function(e){
  if($("#p-tutor").hidden||!TU.run)return;var tg=e.target;if(tg.tagName==="INPUT"||tg.getAttribute("role")==="tab")return;
  if(!TU.run.answered&&/^[1-4]$/.test(e.key)&&!(TU.mode==="audio"&&TU.run.cur&&TU.run.cur.d==="v2e"&&false)){TU.pick(+e.key-1)}
  else if(TU.run.answered&&e.key==="Enter"&&tg.id!=="tunext"){e.preventDefault();TU.next()}
});
